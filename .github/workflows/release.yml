name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild, such as v0.2.1
        required: true
        type: string
      exception_reason:
        description: Why rebuilding this tagged release is necessary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  policy:
    name: Release policy
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.policy.outputs.release_tag }}
      release_version: ${{ steps.policy.outputs.release_version }}
      release_commit: ${{ steps.policy.outputs.release_commit }}
      previous_version: ${{ steps.policy.outputs.previous_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - id: policy
        name: Validate release tag, commit, and versions
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          EXCEPTION_REASON: ${{ inputs.exception_reason }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if (( ${#EXCEPTION_REASON} < 20 )); then
            echo "Document a meaningful rebuild reason of at least 20 characters." >&2
            exit 1
          fi
          RELEASE_TAG="$MANUAL_TAG"

          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tags must begin with v." >&2
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          node scripts/verify-release-version.mjs "$RELEASE_VERSION"
          node scripts/verify-installer-contract.mjs

          git fetch --no-tags origin main
          RELEASE_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "Release tag $RELEASE_TAG does not identify a commit on origin/main." >&2
            exit 1
          fi

          release_error="$RUNNER_TEMP/release-query.err"
          set +e
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_TAG" 2>"$release_error")"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            is_draft="$(printf '%s' "$release_json" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(String(JSON.parse(value).draft)))")"
            if [[ "$is_draft" != "true" ]]; then
              echo "Published release $RELEASE_TAG cannot be replaced." >&2
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            exit "$release_status"
          fi
          rm -f "$release_error"

          PREVIOUS_TAG="$(git tag --list 'v*' --merged origin/main | node scripts/select-previous-release.mjs "$RELEASE_VERSION" --tag-lines)"
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          release_notes_args=("$RELEASE_VERSION")
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            release_notes_args+=(--previous "$PREVIOUS_VERSION")
          fi
          node scripts/prepare-release-notes.mjs "${release_notes_args[@]}"

          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_version=$RELEASE_VERSION"
            echo "release_commit=$RELEASE_COMMIT"
            echo "previous_version=$PREVIOUS_VERSION"
          } >> "$GITHUB_OUTPUT"

  teleport:
    name: Teleport Machine ID
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Teleport
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1
        with:
          version: "18.10.1"
          proxy: ssh.tauryk.gekkofyre.io:443
      - name: Authenticate with Teleport Machine ID
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2
        with:
          proxy: ssh.tauryk.gekkofyre.io:443
          token: github-actions-onair-wyrmgrid
          certificate-ttl: 15m
      - name: Verify least-privileged Teleport access
        shell: bash
        run: |
          set -euo pipefail
          remote_identity="$(tsh ssh jenkins@web.tauryk.gekkofyre.io \
            'printf "%s@%s\n" "$(whoami)" "$(hostname)"')"
          test "$remote_identity" = "jenkins@web.tauryk.gekkofyre.io"

  verify:
    name: Required tests
    needs: [policy, teleport]
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.policy.outputs.release_tag }}

  security:
    name: Required security checks
    needs: [policy, teleport]
    uses: ./.github/workflows/security.yml
    with:
      checkout_ref: ${{ needs.policy.outputs.release_tag }}

  build:
    name: Build ${{ matrix.platform }}
    needs: [policy, verify, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
            artifact_name: windows-nsis
            artifact_paths: target/release/bundle/nsis/*-setup.exe
            upload_sentry_source_maps: true
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
            artifact_name: linux-packages
            artifact_paths: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
            upload_sentry_source_maps: false
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.policy.outputs.release_tag }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          SENTRY_AUTH_TOKEN: ${{ matrix.upload_sentry_source_maps && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_UI_PROJECT: ${{ vars.SENTRY_UI_PROJECT }}
          SENTRY_RELEASE: onair-wyrmgrid@${{ needs.policy.outputs.release_version }}
          SENTRY_UPLOAD_SOURCEMAPS: ${{ matrix.upload_sentry_source_maps }}
          VITE_SENTRY_RELEASE: onair-wyrmgrid@${{ needs.policy.outputs.release_version }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
      - name: Find the nearest previous published NSIS release
        if: matrix.platform == 'windows-latest'
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.policy.outputs.release_version }}
        run: |
          $publishedNsisTags = gh api --paginate --slurp 'repos/{owner}/{repo}/releases?per_page=100' |
            node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const pages = JSON.parse(value); for (const release of pages.flat()) { if (!release.draft && release.assets.some(asset => asset.name.endsWith('-setup.exe'))) console.log(release.tag_name); } });"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to enumerate prior published NSIS releases.'
          }
          $selection = $publishedNsisTags |
            node scripts/select-previous-release.mjs $env:RELEASE_VERSION --tag-lines
          $previousTag = "$selection".Trim()

          if (-not $previousTag) {
            Write-Host 'No prior published release exists; running a clean-install smoke test.'
            exit 0
          }

          $directory = Join-Path $env:RUNNER_TEMP 'previous-wyrmgrid-release'
          New-Item -ItemType Directory -Path $directory | Out-Null
          gh release download $previousTag --pattern '*-setup.exe' --dir $directory
          $installers = @(Get-ChildItem -LiteralPath $directory -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS setup from $previousTag; found $($installers.Count)."
          }

          "previous_installer=$($installers[0].FullName)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Selected $previousTag for in-place upgrade verification."
      - name: Smoke-test a clean install or in-place NSIS upgrade
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          PREVIOUS_INSTALLER: ${{ steps.previous.outputs.previous_installer }}
        run: |
          $installer = Get-ChildItem -Path 'target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The NSIS build did not produce an installer.' }

          $arguments = @{
            InstallerPath = $installer.FullName
            InstallDirectory = Join-Path $env:RUNNER_TEMP 'WyrmGridNsisSmoke'
          }
          if ($env:PREVIOUS_INSTALLER) {
            $arguments.PreviousInstallerPath = $env:PREVIOUS_INSTALLER
          }

          ./scripts/test-nsis-installer.ps1 @arguments
      - name: Stage platform packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    name: Attest and create draft release
    needs: [policy, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.policy.outputs.release_tag }}
      - name: Download platform packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: downloaded-assets
          merge-multiple: true
      - name: Flatten packages and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' packages < <(find downloaded-assets -type f -print0)
          if (( ${#packages[@]} == 0 )); then
            echo "No release packages were downloaded." >&2
            exit 1
          fi

          mkdir release-assets
          for package in "${packages[@]}"; do
            name="$(basename "$package")"
            name="${name// /.}"
            if [[ -e "release-assets/$name" ]]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            cp "$package" "release-assets/$name"
          done

          checksum_file="$(mktemp)"
          (
            cd release-assets
            find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > "$checksum_file"
          )
          mv "$checksum_file" release-assets/SHA256SUMS.txt
      - name: Attest release packages and checksums
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: release-assets/*
      - name: Prepare curated release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.policy.outputs.release_version }}
          PREVIOUS_VERSION: ${{ needs.policy.outputs.previous_version }}
        run: |
          set -euo pipefail
          release_notes_args=("$RELEASE_VERSION" --output "$RUNNER_TEMP/release-notes.md")
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            release_notes_args+=(--previous "$PREVIOUS_VERSION")
          fi
          node scripts/prepare-release-notes.mjs "${release_notes_args[@]}"
      - name: Create or update the draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.policy.outputs.release_tag }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0)

          release_error="$RUNNER_TEMP/release-query-publish.err"
          set +e
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_TAG" 2>"$release_error")"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            is_draft="$(printf '%s' "$release_json" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(String(JSON.parse(value).draft)))")"
            if [[ "$is_draft" != "true" ]]; then
              echo "Published release $RELEASE_TAG cannot be replaced." >&2
              exit 1
            fi
            rm -f "$release_error"
            gh release edit "$RELEASE_TAG" \
              --draft \
              --prerelease \
              --title "OnAir WyrmGrid $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          elif grep -q 'HTTP 404' "$release_error"; then
            rm -f "$release_error"
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --prerelease \
              --title "OnAir WyrmGrid $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES"
          else
            cat "$release_error" >&2
            exit "$release_status"
          fi
